#
# 可复用构建核心（workflow_call）。
# build-openwrt.yml / H29K.yml / R2S.yml / R4S.yml 都调用这里，
# 这样四个设备的构建步骤只有一份，不会各自改动后互相不一致。
#

name: Build core

on:
  workflow_call:
    inputs:
      config_file:
        description: 仓库内的 .config 种子文件路径
        type: string
        required: true
      device_label:
        description: 产物标签，例如 H29K
        type: string
        required: true
      files_dir:
        description: 设备专属 rootfs 覆盖目录（放在 openwrt/files 下）
        type: string
        required: false
        default: files
      upload_release:
        description: 是否创建 GitHub Release
        type: boolean
        required: false
        default: true
      ssh:
        description: 是否开启 tmate 调试会话
        type: boolean
        required: false
        default: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.device_label }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      CONFIG_FILE: ${{ inputs.config_file }}
      DEVICE_LABEL: ${{ inputs.device_label }}
      FILES_DIR: ${{ inputs.files_dir }}
      UPLOAD_RELEASE: ${{ inputs.upload_release }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar file flex gawk gettext \
          genisoimage git gperf haveged help2man intltool libelf-dev libglib2.0-dev \
          libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
          libreadline-dev libssl-dev libtool lrzsz msmtp nano ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pyelftools libpython3-dev qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        df -hT /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then mv "$FEEDS_CONF" openwrt/feeds.conf.default; fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        if [ -n "$FILES_DIR" ] && [ -d "$FILES_DIR" ]; then mv "$FILES_DIR" openwrt/files; fi
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "错误：配置种子 $CONFIG_FILE 不存在" >&2
          exit 1
        fi
        mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: inputs.ssh
      with:
        limit-access-to-actor: false

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make -j8 download
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) 线程编译"
        make -j"$(nproc)" || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"

        profile="$(sed -n 's/^CONFIG_TARGET_PROFILE="DEVICE_\(.*\)"$/\1/p' .config | head -n 1)"
        if [ -z "$profile" ]; then
          profile="$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config | head -n 1)"
        fi
        echo "DEVICE_NAME=_${profile}" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"
        echo "rootfs 分区大小: $(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=//p' .config) MiB"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_${{ env.DEVICE_LABEL }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: warn

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        {
          echo "设备：${DEVICE_LABEL} ${DEVICE_NAME#_}"
          echo ""
          echo "源码：${REPO_URL}（${REPO_BRANCH}）"
          echo "rootfs 分区：$(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=//p' openwrt/.config) MiB"
          echo "构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')"
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      if: (!cancelled())
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
