# 斐讯 K2（ramips / mt7620），使用仓库根目录的 .config。
# lede 源码更新时由 update-checker 触发（repository_dispatch: source-update）。
#

name: Build OpenWrt

on:
  repository_dispatch:
    types: [source-update]
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启 tmate 调试会话
        type: boolean
        required: false
        default: false

concurrency:
  group: build-k2
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-core.yml
    with:
      config_file: .config
      device_label: K2
      upload_release: true
      ssh: ${{ github.event.inputs.ssh == 'true' }}
    secrets: inherit
