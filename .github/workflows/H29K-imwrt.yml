#
# H29K 固件构建（ImmortalWrt 体系）
#
# 为什么不用 coolsnowwolf/lede：qmodem 依赖 kmod-mhi-wwan / quectel-CM-5G，
# 这两个包 lede 里没有，defconfig 会把 qmodem 直接丢掉 → 编译出来的镜像没有 5G 拨号。
# ImmortalWrt 的 feeds 里有这两个包，qmodem 可以正常选中。
#
# 但官方 ImmortalWrt 没有 hinlink/h29k 的板级支持，所以这里在构建时：
#   1. 拉 ouyangzq/H29KorH69K-OPENWRT 这个社区 BSP
#   2. 把它提供的补丁/驱动包应用到 ImmortalWrt 源码
#   3. 追加设备定义（BSP 自带的那份 patch 用 fuzz 应用时会插错位置，这里改成干净追加）
#
# 本机验证记录见 README「H29K：从源码构建 Journey」。
#

name: H29K (ImmortalWrt)

on:
  # 提交 ci-trigger.txt 即触发一次构建（在没有 Actions 写权限时使用）
  push:
    branches: [ main ]
    paths:
      - 'ci-trigger.txt'
  workflow_dispatch:
    inputs:
      rootfs_mb:
        description: 'rootfs 分区大小（MiB）'
        type: string
        required: false
        default: '2048'
      imwrt_ref:
        description: 'ImmortalWrt 参考；留空=用已验证的 e695009c，填 master 则跟最新'
        type: string
        required: false
        default: ''
      upload_release:
        description: '是否创建 GitHub Release'
        type: boolean
        required: false
        default: true
      ssh:
        description: '开启 tmate 调试会话'
        type: boolean
        required: false
        default: false
  # 每周日 03:00 UTC（北京时间 11:00）自动跟上游编一版
#   schedule:
#     - cron: '0 3 * * 0'

env:
  IMWRT_URL: https://github.com/immortalwrt/immortalwrt
  IMWRT_BRANCH: master
  # 已知可用（BSP 补丁能干净应用）的 ImmortalWrt 提交，上游漂移导致预检失败时用它兜底
  IMWRT_FALLBACK: e695009c15c623f4f6a83376b505faaf7a4ae5b5
  BSP_URL: https://github.com/ouyangzq/H29KorH69K-OPENWRT
  BSP_REF: main
  KERNEL_DIR: target/linux/rockchip/patches-6.18
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build H29K (ImmortalWrt)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    env:
      ROOTFS_MB: ${{ github.event.inputs.rootfs_mb || '2048' }}
      # 手动构建默认用已验证的提交（不会被上游漂移打断）；定时构建走 master 跟最新
      IMWRT_REF: ${{ github.event.inputs.imwrt_ref || (github.event_name != 'workflow_dispatch' && 'master') || 'e695009c15c623f4f6a83376b505faaf7a4ae5b5' }}
      UPLOAD_RELEASE: ${{ github.event.inputs.upload_release != 'false' }}
      DEVICE_LABEL: H29K
      CONFIG_FILE: configs/h29k-imwrt.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar file flex gawk gettext \
          genisoimage git gperf haveged help2man intltool libelf-dev libglib2.0-dev \
          libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
          libssl-dev libtool lrzsz msmtp nano ninja-build p7zip-full patch pkgconf python3 \
          python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        df -hT /

    - name: Clone ImmortalWrt and BSP
      run: |
        git clone --depth 1 -b "$IMWRT_BRANCH" "$IMWRT_URL" imwrt
        # 默认跟 master（拿最新依赖）；也可手动指定 commit/分支
        if [ -n "$IMWRT_REF" ]; then
          ( cd imwrt && git fetch --depth 1 origin "$IMWRT_REF" && git checkout -q FETCH_HEAD ) || {
            echo "::error::无法切到 $IMWRT_REF"; exit 1; }
          echo "ImmortalWrt 使用指定参考：$IMWRT_REF"
        else
          echo "ImmortalWrt 使用 master 最新：$(cd imwrt && git rev-parse --short HEAD)"
        fi
        git clone --depth 1 -b "$BSP_REF" "$BSP_URL" bsp
        du -sh imwrt bsp

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: imwrt/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('configs/h29k-imwrt.config') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Apply BSP patches
      run: |
        set -e
        cd imwrt

        # 1) 改上游 OpenWrt 自身文件（能干净应用的用 git apply）
        git apply ../bsp/openwrt-patches/patches/001-kmod-fbdev-allow-rockchip.patch
        git apply ../bsp/openwrt-patches/patches/003-rockchip-kernel-config.patch

        # 2) 其余补丁上游有漂移，用 fuzz 应用
        patch -p1 -F3 < ../bsp/openwrt-patches/patches/002-uboot-add-generic-rk35xx.patch
        # 上游漂移时 002 补丁会把变体插到错误位置（不进 UBOOT_TARGETS / 嵌进别的 define），
        # 这里用确定性脚本重建，不依赖插入位置
        sh ../board/h29k/normalize-uboot.sh package/boot/uboot-rockchip/Makefile
        patch -p1 -F3 < ../bsp/dts/patches/002-rockchip-armv8-02network-hinlink-devices.patch

        # 注意：不要应用 dts/patches/001-armv8-hinlink-devices.patch
        # 它会把 Device/hinlink_opc-h29k 插进 friendlyarm_nanopi-r2s 的 define 里，
        # 导致设备索引不到、还破坏 nanopi-r2s。设备定义见下一步。

        # 3) 内核补丁：只加 H29K 板级 dts 和 mmc 修复
        #    800（厂商 rk3528.dtsi）在 linux-6.18.55 上 48 个 hunk 有 8 个对不上，
        #    而且它和"删除上游 PCIe/USB 补丁"是配套的，这里改成走上游 dtsi：
        #    保留上游补丁集完整，只用 102 加板级 dts、107 修 mmc 断电电压。
        #    185（RKRNG）在 6.18.55 上也已对不上，去掉只损失硬件随机数加速。
        mkdir -p "$KERNEL_DIR"
        cp ../bsp/dts/kernel-patches/102-arm64-dts-rockchip-add-HINLINK-OPC-H29K.patch "$KERNEL_DIR"/
        # 102 的板级 dts 把 vcc_3v3_lcd 的使能脚设成 gpio0 PA0，而我们的面板背光
        # （led-gpios）也用 PA0 —— 同一个脚被稳压器和 fbtft 抢，probe 直接 -EBUSY，屏不亮。
        # 原厂 1.14 寸那版是"稳压器常开、PA0 只做背光"，这里对齐：去掉使能脚，保留 always-on。
        sed -i '/enable-active-high;/d; /gpio = <&gpio0 RK_PA0 GPIO_ACTIVE_HIGH>;/d' \
          ../bsp/dts/kernel-patches/102-arm64-dts-rockchip-add-HINLINK-OPC-H29K.patch
        echo "102 补丁已去掉 PA0 使能脚（背光留给我们）"
        cp ../bsp/dts/kernel-patches/107-mmc-core-set-initial-signal-voltage-on-power-off.patch "$KERNEL_DIR"/
        # 104：把面板节点换成 1.14 寸 ST7789V（135x240 / 6MHz / 背光 gpio0 PA0）。
        # BSP 默认 dts 是 1.47 寸 GC9307（172x320 / 15MHz / PA1），小屏机器用错就不亮。
        cp ../board/h29k/104-h29k-panel-st7789v.patch "$KERNEL_DIR"/

        # 4) BSP 功能包（WiFi/屏幕/触摸/风扇/主题等）
        for d in aic8800 aic8800-loader hinlink-settings kmod-fb-tft-gc9307 \
                 kmod-input-touchscreen-axs5106 kmod-saradc-rockchip luci-app-fan-h69k \
                 luci-app-oled luci-proto-modem-pro luci-theme-daocaoren modem-pro \
                 modemband tft-display; do
          rm -rf "package/$d"
          cp -a "../bsp/$d" "package/"
        done

        # 4.5) fb-tft 去掉对 video-support 的硬依赖（本地验证用，避免它又拉回一堆 video 包）
        sed -i 's|^  DEPENDS:=video-support $(FBDEV_TARGETS)|  DEPENDS:=$(FBDEV_TARGETS)|' package/kernel/linux/modules/video.mk

        # 5) 仓库自带：st7789v 的 fbtft kmod 定义，追加进 video.mk
        #    （这类内核模块包不能单独放 package/，否则缺内核构建上下文会报 No targets specified）
        grep -q 'KernelPackage/fb-tft-st7789v' package/kernel/linux/modules/video.mk || \
          sed '1s/^\xEF\xBB\xBF//' ../board/h29k/video-st7789v.mk >> package/kernel/linux/modules/video.mk

    - name: Add device definition
      run: |
        # BSP 的 001-armv8-hinlink-devices.patch 用 fuzz 应用会把设备定义插错位置，
        # 导致设备索引不到。这里用仓库里这份干净的片段直接追加。
        cat board/h29k/device-h29k.mk >> imwrt/target/linux/rockchip/image/armv8.mk
        tail -20 imwrt/target/linux/rockchip/image/armv8.mk

    - name: Setup feeds
      run: |
        cd imwrt
        # 关掉 video feed：它带 qt5base，会和 video-support 形成 kconfig 循环依赖，
        # 导致 package/kernel/linux 构建失败（CI #2 就死在这）。fbtft 的 kmod 在
        # package/kernel/linux 里，不需要这个 feed。
        sed -i 's|^src-git video |#src-git video |' feeds.conf.default
        grep -q '^src-git qmodem' feeds.conf.default || \
          echo 'src-git qmodem https://github.com/FUjr/QModem;main' >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 去掉 squeezelite：它的 Config.in 自引用（PACKAGE_squeezelite-custom ↔ SQUEEZELITE_WMA_ALAC），
        # 会让 kconfig 报 recursive dependency，进而使 package/kernel/linux 的配置不完整而构建失败。
        rm -rf feeds/packages/sound/squeezelite package/feeds/packages/squeezelite

    - name: Copy files overlay
      run: |
        # 仓库 files/h29k 是 rootfs 覆盖层：h29k-netmode（双上行）、Wi-Fi 默认值、
        # SIM 热插拔、LuCI 上行页。少了它镜像里就没有双上行脚本，LAN 也会停在
        # ImmortalWrt 默认的 192.168.1.1。
        mkdir -p imwrt/files
        cp -a files/h29k/. imwrt/files/
        chmod 755 imwrt/files/etc/init.d/h29k-netmode \
                  imwrt/files/etc/init.d/h29k-wifi-defaults \
                  imwrt/files/usr/sbin/h29k-netmode \
                  imwrt/files/etc/uci-defaults/99-h29k-dualwan \
                  imwrt/files/etc/hotplug.d/usb/30-quectel-simdet
        find imwrt/files -type f
    - name: Load configuration
      run: |
        cd imwrt
        if [ ! -f "../$CONFIG_FILE" ]; then
          echo "缺少配置种子 $CONFIG_FILE" >&2
          exit 1
        fi
        cp "../$CONFIG_FILE" .config
        # 分区大小按输入覆盖
        sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_MB}/" .config

        # 上游 feeds 里时不时有包自引用（squeezelite、fwknopd…），kconfig 会报
        # "recursive dependency" 并让配置残缺，最终表现是 package/kernel/linux 构建失败。
        # 这里自动把出问题的包从 feeds 里摘掉再重试，最多 6 轮。
        for i in 1 2 3 4 5 6; do
          # 每轮都从种子重拷：第一轮 kconfig 可能改写 .config 丢掉符号
          cp "../$CONFIG_FILE" .config
          sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_MB}/" .config
          make defconfig > /tmp/dc.log 2>&1 || true
          n=$(grep -c "recursive dependency" /tmp/dc.log || true)
          if [ "${n:-0}" -eq 0 ]; then
            echo "defconfig 干净（第 $i 轮）"
            break
          fi
          echo "第 $i 轮发现 $n 处 recursive dependency，自动摘除相关包："
          grep -oE "(feeds|package)/[A-Za-z0-9_./-]+/Config\.in" /tmp/dc.log | sed "s|/Config\.in$||" | sort -u | while read -r d; do
            [ -e "$d" ] || continue
            base=$(basename "$d")
            echo "  摘除 $d"
            rm -rf "$d"
            rm -rf package/feeds/*/"$base"
          done
          rm -f tmp/.packageinfo tmp/.config-package.in tmp/.targetinfo
        done

        echo "=== 生效的配置 ==="
        grep -E "^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_ROOTFS_(PARTSIZE|SQUASHFS)|^CONFIG_PACKAGE_(qmodem|luci-app-qmodem|luci-app-openclash|kmod-fb-tft|kmod-fb-tft-st7789v|video-support|u-boot-generic-rk3528)=" .config

    - name: Preflight check
      # 目的：把"上游漂移导致补丁插错位置"这类问题在 3 分钟内暴露，
      # 而不是编了 2.5 小时才在打包阶段失败。
      run: |
        cd imwrt
        fail=0
        for sym in \
          CONFIG_TARGET_rockchip_armv8_DEVICE_hinlink_opc-h29k=y \
          CONFIG_PACKAGE_u-boot-generic-rk3528=y \
          CONFIG_PACKAGE_qmodem=y \
          CONFIG_PACKAGE_kmod-fb-tft=y \
          CONFIG_PACKAGE_kmod-fb-tft-st7789v=y ; do
          if grep -qx "$sym" .config; then
            echo "OK   $sym"
          else
            echo "MISS $sym"
            fail=1
          fi
        done
        # 防止 fuzz 静默把内容插到错误位置
        grep -q '^  generic-rk3528 ' package/boot/uboot-rockchip/Makefile || {
          echo "::error::u-boot 变体没进 UBOOT_TARGETS（BSP 补丁插入位置变了）"; fail=1; }
        grep -q '^define Device/hinlink_opc-h29k' target/linux/rockchip/image/armv8.mk || {
          echo "::error::设备定义缺失"; fail=1; }
        grep -q 'KernelPackage/fb-tft-st7789v' package/kernel/linux/modules/video.mk || {
          echo "::error::st7789v 的 kmod 定义没追上"; fail=1; }
        if [ "$fail" = "1" ]; then
          echo "::error::预检失败：上游 ImmortalWrt 已漂移，BSP 补丁需要更新"
          echo "::error::应急办法：用 imwrt_ref=${IMWRT_FALLBACK:-e695009c} 重跑（该提交已验证可编）"
          exit 1
        fi
        echo "预检通过：设备/uboot/qmodem/屏幕驱动都在"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: inputs.ssh
      with:
        limit-access-to-actor: false

    - name: Download package
      run: |
        cd imwrt
        make -j8 download
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd imwrt
        make -j"$(nproc)" || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "DEVICE_NAME=_hinlink_opc-h29k" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Organize files
      id: organize
      run: |
        cd imwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"
        ls -lh

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_H29K${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: warn

    - name: Generate release tag
      id: tag
      if: success() && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        {
          echo "设备：H29K（HINLINK OPC-H29K / RK3528）"
          echo ""
          echo "源码：ImmortalWrt ${IMWRT_BRANCH} + H29K BSP"
          echo "rootfs 分区：${ROOTFS_MB} MiB（squashfs + overlay）"
          echo "构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')"
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: success() && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: imwrt/bin/targets/rockchip/armv8/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      if: (!cancelled())
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
