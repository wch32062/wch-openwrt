# FriendlyARM NanoPi R2S（Rockchip RK3328）
# 配置见 configs/r2s.config。
#

name: R2S

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启 tmate 调试会话
        type: boolean
        required: false
        default: false

concurrency:
  group: build-r2s
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-core.yml
    with:
      config_file: configs/r2s.config
      device_label: R2S
      upload_release: false
      ssh: ${{ github.event.inputs.ssh == 'true' }}
    secrets: inherit
